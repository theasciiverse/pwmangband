# Builds PWMAngband for the Asciiverse catalog and as system packages.
#
# For av: one archive per target, named pwmangband-<target>.tar.gz, plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github"). Each archive holds the server (pwmangband),
# the curses client (pwmangclient), the game data in lib/, upstream's
# mangband.cfg and pwmangband-play, which av launches: a private game on
# this machine, or with a host a server elsewhere.
# For everyone else: .deb, .rpm, .apk and Arch packages from the same static
# Linux build, made by nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v1.6.2.3-av.1: upstream's version (1.6.2 build 3), then our
# packaging release. Linux builds are fully static (Alpine, ncurses linked
# in); macOS builds both architectures on one runner against the system
# ncurses. No Windows build yet (PATCHES.md).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: pwmangband
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh asciiverse/build.sh
          sudo chown -R "$(id -u):$(id -g)" .
          file pwmangband pwmangclient

      - name: Package for av
        run: |
          # the start script sits at the top of the archive, where av looks for it
          sh asciiverse/stage.sh
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build
        run: |
          brew install autoconf automake >/dev/null
          CC_ARCH=${{ matrix.arch }} sh asciiverse/build.sh
          file pwmangband pwmangclient
          otool -L pwmangclient

      - name: Package
        run: |
          sh asciiverse/stage.sh
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "PWMAngband $TAG" \
                 --notes "PWMAngband 1.6.2 build 3 by the MAngband and PWMAngband developers, curses client and server, built for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. See PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
